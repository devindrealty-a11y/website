<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" role="img" aria-labelledby="transitTitle transitDesc">
  <title id="transitTitle">Schematic of SkyTrain and the West Coast Express</title>
  <desc id="transitDesc">An original straight-line diagram drawn for this guide. It is not a TransLink map and it is not to scale. Canada Line runs from downtown Vancouver to Richmond, with a branch to YVR. Expo Line runs from Waterfront through Commercial-Broadway toward Surrey. Millennium Line station order, west to east: VCC-Clark, Commercial-Broadway, Renfrew, Rupert, Gilmore, Brentwood Town Centre, Holdom, Sperling-Burnaby Lake, Lake City Way, Production Way-University, Lougheed Town Centre, Burquitlam, Moody Centre, Inlet Centre, Coquitlam Central, Lincoln, Lafarge Lake-Douglas. The last six are the Evergreen Extension, which is part of the Millennium Line. West Coast Express, west to east: Waterfront, Moody Centre, Coquitlam Central, Port Coquitlam, Pitt Meadows, Maple Meadows, Port Haney, Mission City.</desc>
  <rect width="1040" height="560" rx="12" fill="#f4f7fb"/>
  <text x="28" y="32" font-family="Montserrat, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4" fill="#132639">A SCHEMATIC, NOT A MAP</text>
  <text x="28" y="52" font-family="Inter, Arial, sans-serif" font-size="12" fill="#56616d">Original diagram for this guide. Station order is TransLink’s. Not to scale. Checked 11 October 2026.</text>

  <text x="28" y="88" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#1f7a62">CANADA LINE</text>
  <line x1="160" y1="84" x2="640" y2="84" stroke="#1f7a62" stroke-width="7" stroke-linecap="round"/>
  <line x1="430" y1="84" x2="430" y2="118" stroke="#1f7a62" stroke-width="7" stroke-linecap="round"/>
  <circle cx="160" cy="84" r="7" fill="#fff" stroke="#1f7a62" stroke-width="3"/>
  <circle cx="640" cy="84" r="7" fill="#fff" stroke="#1f7a62" stroke-width="3"/>
  <circle cx="430" cy="118" r="7" fill="#fff" stroke="#1f7a62" stroke-width="3"/>
  <text x="160" y="72" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#27333f">Downtown</text>
  <text x="640" y="72" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#27333f">Richmond</text>
  <text x="446" y="122" font-family="Inter, Arial, sans-serif" font-size="12" fill="#27333f">YVR</text>
  <text x="680" y="88" font-family="Inter, Arial, sans-serif" font-size="12" fill="#56616d">SeaBus: Waterfront ? Lonsdale Quay</text>

  <text x="28" y="168" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5c6b7a">EXPO LINE</text>
  <line x1="160" y1="164" x2="980" y2="164" stroke="#5c6b7a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="160" cy="164" r="7" fill="#fff" stroke="#5c6b7a" stroke-width="3"/>
  <circle cx="420" cy="164" r="7" fill="#fff" stroke="#5c6b7a" stroke-width="3"/>
  <circle cx="980" cy="164" r="7" fill="#fff" stroke="#5c6b7a" stroke-width="3"/>
  <text x="160" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#27333f">Waterfront</text>
  <text x="420" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#27333f">Commercial–Broadway</text>
  <text x="620" y="154" font-family="Inter, Arial, sans-serif" font-size="12" fill="#27333f">Burnaby · New Westminster · Surrey</text>

  <text x="28" y="230" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#24578c">MILLENNIUM LINE</text>
  <text x="196" y="230" font-family="Inter, Arial, sans-serif" font-size="12" fill="#56616d">Evergreen Extension is the east end of this line — you do not transfer to a different train.</text>
  <line x1="48" y1="292" x2="1000" y2="292" stroke="#24578c" stroke-width="6" stroke-linecap="round"/>
  <!-- city bands -->
  <rect x="40" y="248" width="200" height="18" rx="9" fill="#e8eef5"/>
  <rect x="268" y="248" width="390" height="18" rx="9" fill="#e8eef5"/>
  <rect x="686" y="248" width="328" height="18" rx="9" fill="#d7e6f6"/>
  <text x="140" y="261" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700" fill="#24578c">VANCOUVER · 4 STATIONS</text>
  <text x="463" y="261" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700" fill="#24578c">BURNABY · 7 STATIONS</text>
  <text x="850" y="261" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="10" font-weight="700" fill="#173a5e">TRI-CITIES · 6 STATIONS</text>

  <!-- dots: vancouver and burnaby small, tri-cities large. positions match even spacing of 17 stations -->
  <g fill="#24578c">
    <circle cx="48" cy="292" r="4"/><circle cx="107.5" cy="292" r="5" fill="#fff" stroke="#24578c" stroke-width="3"/>
    <circle cx="167" cy="292" r="4"/><circle cx="226.5" cy="292" r="4"/>
    <circle cx="286" cy="292" r="4"/><circle cx="345.5" cy="292" r="4"/><circle cx="405" cy="292" r="4"/>
    <circle cx="464.5" cy="292" r="4"/><circle cx="524" cy="292" r="4"/>
    <circle cx="583.5" cy="292" r="5" fill="#fff" stroke="#24578c" stroke-width="3"/>
    <circle cx="643" cy="292" r="5" fill="#fff" stroke="#24578c" stroke-width="3"/>
  </g>
  <g fill="#173a5e">
    <circle cx="702.5" cy="292" r="8"/><circle cx="762" cy="292" r="8"/><circle cx="821.5" cy="292" r="8"/>
    <circle cx="881" cy="292" r="8"/><circle cx="940.5" cy="292" r="8"/><circle cx="1000" cy="292" r="8"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#132639" font-weight="600">
    <text x="107.5" y="318" text-anchor="middle">Commercial–</text>
    <text x="107.5" y="332" text-anchor="middle">Broadway</text>
    <text x="583.5" y="318" text-anchor="middle">Production</text>
    <text x="583.5" y="332" text-anchor="middle">Way</text>
    <text x="643" y="318" text-anchor="middle">Lougheed</text>
    <text x="702.5" y="348" text-anchor="middle">Burquitlam</text>
    <text x="762" y="366" text-anchor="middle">Moody</text>
    <text x="762" y="380" text-anchor="middle">Centre</text>
    <text x="821.5" y="348" text-anchor="middle">Inlet Centre</text>
    <text x="881" y="366" text-anchor="middle">Coquitlam</text>
    <text x="881" y="380" text-anchor="middle">Central</text>
    <text x="940.5" y="348" text-anchor="middle">Lincoln</text>
    <text x="1000" y="366" text-anchor="end">Lafarge Lake–</text>
    <text x="1000" y="380" text-anchor="end">Douglas</text>
  </g>
  <text x="48" y="430" font-family="Inter, Arial, sans-serif" font-size="11" fill="#56616d">Open circles are transfer stations with the Expo Line (Commercial–Broadway, Production Way–University, Lougheed Town Centre). Filled circles are Evergreen Extension stations.</text>

  <text x="28" y="468" font-family="Montserrat, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2" fill="#8a3030">WEST COAST EXPRESS</text>
  <text x="230" y="468" font-family="Inter, Arial, sans-serif" font-size="12" fill="#56616d">Weekday rush hour only · westbound mornings · eastbound afternoons</text>
  <line x1="80" y1="500" x2="960" y2="500" stroke="#8a3030" stroke-width="5" stroke-linecap="round"/>
  <g fill="#8a3030">
    <circle cx="80" cy="500" r="6"/><circle cx="205.7" cy="500" r="6"/><circle cx="331.4" cy="500" r="6"/><circle cx="457.1" cy="500" r="6"/>
    <circle cx="582.9" cy="500" r="6"/><circle cx="708.6" cy="500" r="6"/><circle cx="834.3" cy="500" r="6"/><circle cx="960" cy="500" r="6"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="11" fill="#132639">
    <text x="80" y="522" text-anchor="middle">Waterfront</text>
    <text x="205.7" y="522" text-anchor="middle">Moody Centre</text>
    <text x="331.4" y="522" text-anchor="middle">Coq. Central</text>
    <text x="457.1" y="522" text-anchor="middle">Port Coquitlam</text>
    <text x="582.9" y="522" text-anchor="middle">Pitt Meadows</text>
    <text x="708.6" y="522" text-anchor="middle">Maple Meadows</text>
    <text x="834.3" y="522" text-anchor="middle">Port Haney</text>
    <text x="960" y="522" text-anchor="middle">Mission City</text>
  </g>
</svg>
