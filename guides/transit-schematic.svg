<svg style="font-family:Inter,Arial,sans-serif" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" role="img" aria-labelledby="transitTitle transitDesc">
<title id="transitTitle">Schematic of SkyTrain and the West Coast Express</title>
<desc id="transitDesc">An original straight-line diagram drawn for this guide. It is not a TransLink map and it is not to scale. Canada Line runs from Waterfront to Richmond–Brighouse with a branch to YVR–Airport. Expo Line runs from Waterfront through Commercial–Broadway, Burnaby and New Westminster into Surrey. Millennium Line, west to east: VCC–Clark, Commercial–Broadway, Renfrew, Rupert, Gilmore, Brentwood Town Centre, Holdom, Sperling–Burnaby Lake, Lake City Way, Production Way–University, Lougheed Town Centre, Burquitlam, Moody Centre, Inlet Centre, Coquitlam Central, Lincoln, Lafarge Lake–Douglas. The last six are the Evergreen Extension, part of the Millennium Line. West Coast Express, west to east: Waterfront, Moody Centre, Coquitlam Central, Port Coquitlam, Pitt Meadows, Maple Meadows, Port Haney, Mission City.</desc>
<rect width="700" height="560" rx="12" fill="#f4f6f8"/>
<text x="28" y="36" font-family="Montserrat,Arial,sans-serif" font-weight="800" letter-spacing="1.6" font-size="10.5" fill="#1f8a70" text-anchor="start">CANADA LINE</text>
<text x="135" y="36" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="500" fill="#56616d" text-anchor="start">Waterfront to Richmond, with a branch to the airport.</text>
