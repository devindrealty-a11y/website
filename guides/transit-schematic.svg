<text x="400" y="82" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#132639" text-anchor="middle">Richmond–Brighouse</text>
<text x="266" y="92" font-family="Inter,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#132639" text-anchor="start">YVR–Airport</text>
