<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1080px; height: 1080px; overflow: hidden; }
  body { font-family: Georgia, "Times New Roman", serif; color: #fff; background: #0d1b2a; }
  img.bg { position: absolute; inset: 0; width: 1080px; height: 1080px; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(13,27,42,.15) 0%, rgba(13,27,42,.88) 58%); }
  .inner { position: relative; z-index: 1; height: 1080px; padding: 64px 72px 56px; display: flex; flex-direction: column; justify-content: flex-end; }
  .eyebrow { font-family: "Trebuchet MS", sans-serif; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; font-size: 22px; color: #93bde6; margin: 0 0 18px; }
  h1 { font-size: 68px; line-height: 1.02; font-weight: 500; margin: 0 0 22px; letter-spacing: -.02em; }
  .fig { font-size: 92px; line-height: .9; margin: 0 0 10px; }
  p { font-family: "Trebuchet MS", sans-serif; font-size: 28px; line-height: 1.35; margin: 0; max-width: 900px; }
  .brand { margin-top: 28px; font-family: "Trebuchet MS", sans-serif; font-size: 26px; font-weight: 700; }
  .sub { font-weight: 400; opacity: .9; }
</style>
</head>
<body>
  <img class="bg" src="../assets/img/blog/photos/vancouver-skyline-queen-elizabeth-park.jpg" alt="">
  <div class="shade"></div>
  <div class="inner">
    <p class="eyebrow">First home · British Columbia</p>
    <p class="fig">Up to $50,000</p>
    <h1>back in GST on a new home.</h1>
    <p>First-time buyers of a new home priced at $1 million or less may get the GST back, up to $50,000. Property transfer tax can also be reduced or removed. Free guide.</p>
    <p class="brand">Axford Real Estate <span class="sub">· Devin Desaulniers · 604-809-1032</span></p>
  </div>
</body>
</html>
