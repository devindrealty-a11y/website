# Refresh active Greater Vancouver and Fraser Valley residential listings from
# the CREA REALTOR.ca DDF feed. Every 12 hours, and whenever someone runs it
# from the Actions tab. DDF rules require a refresh at least every 24 hours;
# this schedule is inside that window even if one run is delayed.
#
# Secrets (repository Settings → Secrets and variables → Actions):
#   DDF_USERNAME  destination username (Web API client id)
#   DDF_PASSWORD  destination password (Web API client secret)
# If either secret is missing, the script exits 0 and leaves listings/data.json alone.
name: Refresh DDF listings

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ddf-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull active listings
        env:
          DDF_USERNAME: ${{ secrets.DDF_USERNAME }}
          DDF_PASSWORD: ${{ secrets.DDF_PASSWORD }}
        run: python3 scripts/fetch_ddf_listings.py

      - name: Commit listings/data.json when it changed
        run: |
          if git diff --quiet -- listings/data.json; then
            echo "No change in listings/data.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add listings/data.json
          git commit -m "Refresh active listings from the DDF feed"
          git push
